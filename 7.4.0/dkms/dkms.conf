PACKAGE_NAME="amdgpu-minfan"
PACKAGE_VERSION="1.0"

# Out-of-tree build of the single patched amdgpu module against the installed
# kernel headers (vermagic + MODVERSIONS CRCs therefore match the running
# kernel). amdgpu_trace.h's TRACE_INCLUDE_PATH is rewritten to "." by
# install.sh, which is what makes the M= build work outside the kernel tree.
# Absolute path: kbuild resolves a relative M= against the -C directory, and
# this dkms only substitutes $kernel_source_dir / $dkms_tree in MAKE.
MAKE[0]="make -C $kernel_source_dir M=$dkms_tree/amdgpu-minfan/1.0/build/drivers/gpu/drm/amd/amdgpu -j16 modules"
CLEAN="make -C $kernel_source_dir M=$dkms_tree/amdgpu-minfan/1.0/build/drivers/gpu/drm/amd/amdgpu clean"

BUILT_MODULE_NAME[0]="amdgpu"
BUILT_MODULE_LOCATION[0]="drivers/gpu/drm/amd/amdgpu"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
